<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Bridge AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f8f9fa] text-[#1a1a1a] font-sans min-h-screen">
    <div id="root">
      <div class="max-w-2xl mx-auto p-6 md:p-12">
        <header class="mb-12 text-center">
          <h1 class="text-4xl font-semibold tracking-tight mb-2">Universal Bridge AI</h1>
          <p class="text-gray-500">Messy Input → Structured Intelligence</p>
        </header>

        <main class="space-y-8">
          <!-- Input Section -->
          <section id="input-section" class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
            <div class="space-y-4">
              <textarea 
                id="messy-input" 
                placeholder="Type your messy input here... (e.g., 'my dad chest pain since morning')"
                class="w-full h-32 p-4 rounded-xl border border-gray-200 focus:ring-2 focus:ring-black focus:border-transparent outline-none transition-all resize-none text-lg"
              ></textarea>
              
              <div class="flex flex-wrap gap-3">
                <button id="process-btn" class="flex-1 bg-black text-white font-medium py-3 px-6 rounded-xl hover:bg-gray-800 transition-colors flex items-center justify-center gap-2">
                  <span>Process Input</span>
                  <div id="loader" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                </button>
                
                <button id="voice-btn" class="p-3 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors" title="Voice Input">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
                </button>

                <label class="p-3 rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer" title="Image Analysis">
                  <input type="file" id="image-input" class="hidden" accept="image/*">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                </label>
              </div>
              <p id="voice-status" class="text-xs text-gray-400 text-center h-4"></p>
            </div>
          </section>

          <!-- Emergency Banner -->
          <div id="emergency-banner" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl flex items-start gap-3 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
            <div>
              <p class="font-semibold">High Urgency Detected</p>
              <p class="text-sm opacity-90">Please contact emergency services immediately if this is a life-threatening situation.</p>
            </div>
          </div>

          <!-- Output Section -->
          <section id="output-section" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Intent</p>
                <p id="output-intent" class="font-semibold text-lg">🧠 Medical</p>
              </div>
              <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                <p class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Urgency</p>
                <p id="output-urgency" class="font-semibold text-lg">⚠️ High</p>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
              <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Structured Summary</h3>
              <div id="output-summary" class="prose prose-sm max-w-none text-gray-700"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
              <h3 class="text-sm font-medium text-gray-400 uppercase tracking-wider mb-4">Action Steps</h3>
              <ul id="output-actions" class="space-y-3"></ul>
            </div>
          </section>
        </main>

        <footer class="mt-12 text-center text-xs text-gray-400">
          <p>&copy; 2026 Universal Bridge AI. Powered by Gemini.</p>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
